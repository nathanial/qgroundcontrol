<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>QGC Greenfield Prototype</title>
    <style>
      :root {
        color-scheme: dark light;
        font-family: "Segoe UI", Roboto, sans-serif;
      }
      body {
        margin: 0;
        padding: 2rem;
        background: #111827;
        color: #f9fafb;
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        display: grid;
        gap: 2rem;
      }
      h1 {
        margin-top: 0;
        font-size: 2rem;
      }
      section {
        background: rgba(255, 255, 255, 0.04);
        border-radius: 0.75rem;
        padding: 1.5rem;
      }
      #status-badge {
        display: inline-block;
        margin-left: 0.5rem;
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
        background: #1f2937;
        font-size: 0.875rem;
      }
      #rust-log {
        margin-top: 1.5rem;
        padding: 1rem;
        border-radius: 0.75rem;
        background: rgba(255, 255, 255, 0.04);
        min-height: 160px;
        display: flex;
        flex-direction: column-reverse;
        gap: 0.5rem;
      }
      .log-entry {
        padding: 0.5rem 0.75rem;
        border-radius: 0.5rem;
        background: rgba(255, 255, 255, 0.08);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 0.875rem;
        word-break: break-word;
      }
      .log-entry[data-level="error"] {
        background: rgba(239, 68, 68, 0.2);
      }
      .log-entry[data-level="warn"] {
        background: rgba(234, 179, 8, 0.22);
      }
      .controls {
        margin-top: 1rem;
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
      }
      button {
        padding: 0.5rem 1rem;
        border: none;
        border-radius: 0.5rem;
        background: #2563eb;
        color: #f9fafb;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #1d4ed8;
      }
      #vehicle-status, #connection-status, #parameter-stats {
        margin-top: 1rem;
        padding: 1rem;
        border-radius: 0.75rem;
        background: rgba(255, 255, 255, 0.06);
        display: grid;
        gap: 0.4rem;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        color: inherit;
      }
      th, td {
        padding: 0.5rem 0.75rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      tbody tr:hover {
        background: rgba(37, 99, 235, 0.12);
      }
      .device-actions {
        display: flex;
        gap: 0.5rem;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>QGroundControl Greenfield Shell</h1>
        <p>
          Rust core status:
          <span id="status-badge">Waiting…</span>
        </p>
        <div class="controls">
          <button id="run-diagnostics">Run Diagnostics</button>
          <button id="simulate-failure">Simulate Failure</button>
          <button id="refresh-devices">Refresh Links</button>
          <button id="disconnect-link">Disconnect</button>
          <button id="fetch-parameters">Fetch Parameters</button>
        </div>
      </section>
      <section>
        <h2>Available Links</h2>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Label</th>
              <th>Transport</th>
              <th>Details</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="device-table"></tbody>
        </table>
      </section>
      <section>
        <h2>Connection Status</h2>
        <div id="connection-status">Idle</div>
      </section>
      <section>
        <h2>Vehicle Snapshot</h2>
        <div id="vehicle-status">Waiting for heartbeat…</div>
      </section>
      <section>
        <h2>Parameters</h2>
        <div id="parameter-stats">No parameter data yet</div>
      </section>
      <section>
        <h2>Event Log</h2>
        <div id="rust-log"></div>
      </section>
    </main>
    <script type="module" src="./index.js"></script>
  </body>
</html>

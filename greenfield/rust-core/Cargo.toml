[package]
name = "qgc_greenfield_core"
version = "0.1.0"
edition = "2021"
authors = ["QGroundControl Team"]

[lib]
crate-type = ["cdylib"]
name = "qgc_greenfield_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
napi = { version = "2.15", features = ["serde-json", "tokio_rt"] }
napi-derive = { version = "2.15", features = ["type-def"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "time"] }
qgc-domain = { path = "domain-model" }

[build-dependencies]
napi-build = "2.0"

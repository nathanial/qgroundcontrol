[package]
name = "qgc_greenfield_core"
version = "0.1.0"
edition = "2021"
authors = ["QGroundControl Team"]

[lib]
crate-type = ["cdylib"]
name = "qgc_greenfield_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
napi = { version = "2.15", features = ["serde-json"] }
napi-derive = "2.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
napi-build = "2.0"
